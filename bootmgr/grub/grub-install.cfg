insmod normal

insmod gfxmenu
insmod gfxterm_background

insmod android_bootimg_fs
insmod chain
insmod echo
insmod linux
insmod loadenv
insmod loopback
insmod test

initrd_no_align_up

# PERSIST is partition 4 (A/B) or 9 of the disk Android is installed on. Only those partitions
# are checked: searching every device for the label hangs GRUB on some PC firmwares (tablets
# with 32-bit UEFI).
insmod probe
set partition_persist=
for persist_disk in hd0 hd1 hd2 hd3 hd4 hd5 hd6 hd7; do
	for persist_part in gpt4 gpt9; do
		if [ -z "$partition_persist" ]; then
			set persist_label=
			if probe --set=persist_label --label (${persist_disk},${persist_part}); then
				if [ "$persist_label" = "PERSIST" ]; then
					set partition_persist="(${persist_disk},${persist_part})"
				fi
			fi
		fi
	done
done
export partition_persist

# Disk that holds PERSIST, e.g. hd3 from (hd3,gpt4). PCs can have any number of disks.
insmod regexp
set disk_boot=
regexp --set=1:disk_boot '^\((hd[0-9]+),' "$partition_persist"
if [ -z "$disk_boot" ]; then
	set disk_boot=hd0
fi
export disk_boot

if [ "@AB_OTA_UPDATER@" = "true" ]; then
	if [ -n "$partition_persist" ]; then
		load_env -f ${partition_persist}/grubenv_abootctrl abootctrl_global_active_slot
	fi
	if [ ! "$abootctrl_global_active_slot" ]; then
		set abootctrl_global_active_slot=a
	fi
	set ab_kernel_cmdline="androidboot.slot_suffix=_${abootctrl_global_active_slot}"

	loopback recovery /boot.img
else
	loopback recovery /recovery.img
fi
loopback vendor_boot /vendor_boot.img

set gfxmode=1024x768
if [ "$grub_platform" = "efi" ]; then
	set grub_gfx_module="efi_gop"
elif [ "$grub_platform" = "pc" ]; then
	set grub_gfx_module="vbe"
fi
if insmod $grub_gfx_module; then
	terminal_output gfxterm
	loadfont /boot/grub/fonts/unicode.pf2

	insmod gfxmenu
	insmod jpeg
	insmod png
	insmod tga

	if [ "$do_not_load_theme" != "true" ]; then
		set android_theme=1 # Light
		if [ -f /boot/grub/themes/@BOOTMGR_THEME@/theme.cfg ]; then
			source /boot/grub/themes/@BOOTMGR_THEME@/theme.cfg
		fi
	fi
fi

source /.grub_kernel_version.cfg

if [ "@BOOTMGR_THEME@" != "lineage" ]; then
	set kernel_version_display_mainmenu=" ${kernel_version_display}"
	export kernel_version_display_mainmenu
fi

function boot_android_install {
	echo 'Loading parameters...'
	source (recovery)/boot-info.cfg
	source (vendor_boot)/vendor_boot-info.cfg
	source (vendor_boot)/vendor_boot-ramdisk-fragment-info.cfg
	echo 'Loading kernel...'
	linux (recovery)/kernel $android_boot_img_cmdline $android_vendor_boot_img_cmdline $ab_kernel_cmdline $@ @STRIPPED_BOARD_KERNEL_CMDLINE_RECOVERY@ @STRIPPED_BOARD_KERNEL_CMDLINE_INSTALL@ androidboot.mode=recovery androidboot.install=1
	echo 'Loading recovery ramdisk...'
	eval initrd (recovery)/ramdisk.img ${android_vendor_boot_img_ramdisk_fragment_platform_list} ${android_vendor_boot_img_ramdisk_fragment_recovery_list} ${android_vendor_boot_img_ramdisk_fragment_dlkm_list} (vendor_boot)/bootconfig.bin
}

menuentry "Install @BOOTMGR_ANDROID_DISTRIBUTION_NAME@${kernel_version_display_mainmenu}" --class monitor-arrow-down {
	boot_android_install
}

menuentry "Boot from disk" --class harddisk {
	if [ "$grub_platform" = "efi" ]; then
		echo 'Searching for EFI System Partition...'
		search --file --efidisk-only --no-floppy --set=android_esp_device /boot/grub/.is_esp_part_on_android_boot_device
		echo 'Chainloading from EFI System Partition...'
		# 32-bit UEFI firmware can only run the IA32 binary, even on a 64-bit CPU
		if [ "$grub_cpu" = "i386" ]; then
			chainloader (${android_esp_device})/EFI/BOOT/BOOTIA32.EFI
		else
			chainloader (${android_esp_device})/EFI/BOOT/@BOOTMGR_EFI_BOOT_FILENAME@
		fi
	elif [ "$grub_platform" = "pc" ]; then
		echo "Chainloading from ${disk_boot}..."
		chainloader (${disk_boot})+1
	fi
}
